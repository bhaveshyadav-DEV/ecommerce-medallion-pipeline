# This is a Declarative Automation Bundle definition for ecommerce_lakehouse_etl.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ecommerce_lakehouse_etl
  uuid: 153ec9ec-4ac4-4c0f-bc56-bc8508f5aa5f

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0cc14214-f5e5.cloud.databricks.com
    variables:
      catalog: ecommerce_catalog
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-0cc14214-f5e5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/bhaveshyadav@cyntexa.com to make sure we only have a single copy.
      root_path: /Workspace/Users/bhaveshyadav@cyntexa.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ecommerce_catalog
      schema: prod
    permissions:
      - user_name: bhaveshyadav@cyntexa.com
        level: CAN_MANAGE
